name: Build release APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Verify APKs
        run: |
          cd build/app/outputs/flutter-apk
          ls -l *.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "app-$abi-release.apk" | grep -q "lib/$abi/libflutter.so"
            echo "$abi OK: contains only $(unzip -l "app-$abi-release.apk" | grep -o 'lib/[^/]*/libflutter.so' | sort -u | tr '\n' ' ')"
          done
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          for f in app-arm64-v8a-release.apk app-armeabi-v7a-release.apk app-x86_64-release.apk app-release.apk; do
            echo "== $f"
            "$APKSIGNER" verify --verbose --print-certs "$f" | grep -E "Verifies|Number of signers|SHA-256"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: packetstream-mobile-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
