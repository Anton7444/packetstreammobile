name: Build arm64 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build arm64-v8a APK
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            flutter build apk --release --split-per-abi --target-platform android-arm64
            echo "APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: building debug-signed APK"
            flutter build apk --debug --split-per-abi --target-platform android-arm64
            echo "APK=build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Verify APK
        run: |
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|armeabi-v7a|x86_64)/libflutter.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libflutter.so"
          ! unzip -l "$APK" | grep -q "lib/armeabi-v7a/"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E "Verifies|Number of signers|SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: packetstream-mobile-arm64-apk
          path: ${{ env.APK }}
          if-no-files-found: error
